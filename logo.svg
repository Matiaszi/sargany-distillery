<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Sargany Distillery">
  <defs>
    <path id="arcTop" d="M 70,200 A 130,130 0 0 1 330,200"/>
    <path id="arcBot" d="M 62,200 A 138,138 0 0 0 338,200"/>
    <linearGradient id="cu" x1="0" x2="1">
      <stop offset="0" stop-color="#6E3514"/>
      <stop offset=".45" stop-color="#C27A3E"/>
      <stop offset=".6" stop-color="#E0A066"/>
      <stop offset="1" stop-color="#7A3C17"/>
    </linearGradient>
  </defs>
  <circle cx="200" cy="200" r="192" fill="#1E2747"/>
  <circle cx="200" cy="200" r="180" fill="none" stroke="#D9C4A0" stroke-width="3"/>
  <circle cx="200" cy="200" r="104" fill="#D9C4A0"/>
  <circle cx="200" cy="200" r="104" fill="none" stroke="#1E2747" stroke-width="3" stroke-dasharray="2 6"/>
  <text font-family="'Big Shoulders Stencil', 'Big Shoulders Stencil Display', Impact, sans-serif" font-weight="900" font-size="46" letter-spacing="8" fill="#D9C4A0" text-anchor="middle">
    <textPath href="#arcTop" startOffset="50%">SARGANY</textPath>
  </text>
  <text font-family="'Big Shoulders Stencil', 'Big Shoulders Stencil Display', Impact, sans-serif" font-weight="700" font-size="25" letter-spacing="7" fill="#D9C4A0" text-anchor="middle" dominant-baseline="hanging">
    <textPath href="#arcBot" startOffset="50%">DISTILLERY</textPath>
  </text>
  <g fill="#D9C4A0">
    <path d="M58 200 l8 -8 8 8 -8 8z"/>
    <path d="M326 200 l8 -8 8 8 -8 8z"/>
  </g>
  <!-- alembik -->
  <g transform="translate(184 210)">
    <!-- ogień -->
    <path d="M-34 70 q6 -16 12 -4 q4 -18 12 -6 q6 -16 12 0 q6 -14 12 2 q6 -12 10 8z" fill="#B3261E"/>
    <rect x="-46" y="62" width="92" height="8" rx="2" fill="#1E2747"/>
    <!-- kocioł -->
    <path d="M-40 60 C-58 40 -56 0 -30 -12 L30 -12 C56 0 58 40 40 60 Z" fill="url(#cu)" stroke="#1E2747" stroke-width="3"/>
    <path d="M-50 22 H50" stroke="#1E2747" stroke-width="2" opacity=".5"/>
    <!-- hełm -->
    <path d="M-22 -12 C-26 -34 -12 -46 0 -46 C12 -46 26 -34 22 -12 Z" fill="url(#cu)" stroke="#1E2747" stroke-width="3"/>
    <rect x="-4" y="-56" width="8" height="12" fill="#1E2747"/>
    <!-- łabędzia szyja -->
    <path d="M0 -54 C10 -72 40 -70 56 -50 L74 -26" fill="none" stroke="#1E2747" stroke-width="7" stroke-linecap="round"/>
    <path d="M0 -54 C10 -72 40 -70 56 -50 L74 -26" fill="none" stroke="#C27A3E" stroke-width="3.5" stroke-linecap="round"/>
    <!-- chłodnica -->
    <rect x="62" y="-28" width="26" height="54" rx="4" fill="#1E2747"/>
    <path d="M66 -18 h18 M66 -8 h18 M66 2 h18 M66 12 h18" stroke="#C27A3E" stroke-width="2.5"/>
    <path d="M75 26 v10" stroke="#1E2747" stroke-width="4"/>
    <path d="M75 42 c-4 6 -4 10 0 10 c4 0 4 -4 0 -10z" fill="#1E2747"/>
